services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_SMALL_MODEL: ${OPENAI_SMALL_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./backend:/app"]
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports: ["5432:5432"]
    volumes: ["leadpilot_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot -d leadpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  leadpilot_pg:
